# Produção em uma única instância (EC2): Caddy (HTTPS) -> api + web. O banco é externo (RDS).
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Guia completo: docs/DEPLOY_AWS.md
services:
  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env.prod
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: ""  # vazio = mesma origem: o Caddy roteia /api para a API
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, web]
    restart: unless-stopped
volumes:
  caddy_data:
