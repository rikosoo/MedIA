services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: financemed
      POSTGRES_PASSWORD: financemed
      POSTGRES_DB: financemed
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financemed"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://financemed:financemed@db:5432/financemed
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
