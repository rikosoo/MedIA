[project]
name = "optimizer-engine"
version = "0.1.0"
description = "Otimizador misto do FinanceMed AI (OR-Tools CP-SAT; centavos e minutos inteiros)"
requires-python = ">=3.11"
dependencies = ["ortools>=9.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["optimizer_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
