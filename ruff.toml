line-length = 100
target-version = "py311"
extend-exclude = ["services/api/alembic/versions", "apps", ".venv"]

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() em defaults é o idioma do FastAPI

[lint.isort]
known-first-party = ["app", "finance_engine", "tests"]

[lint.per-file-ignores]
"tests/*" = ["E501"]
